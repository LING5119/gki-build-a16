name: Build BakaSU LKM (SUSFS)

on:
  workflow_dispatch:
    inputs:
      kmi:
        description: 'KMI / DDK image tag'
        required: false
        default: 'android16-6.12'
      ddk_release:
        description: 'DDK release suffix'
        required: false
        default: '20260828'
      susfs:
        description: 'Enable SUSFS (y/n)'
        required: false
        default: 'y'

jobs:
  build-lkm:
    name: kernelsu.ko for ${{ inputs.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            bakasu-src

      - name: Prepare tooling
        run: |
          set -e
          pwd; ls
          ls bakasu-src
          echo "KDIR=${KDIR:-<unset>}"
          clang --version | head -2

      - name: Build kernelsu.ko with SUSFS
        run: |
          set -e
          cd bakasu-src/kernel
          SUSFS_FLAG="CONFIG_KSU_SUSFS=n"
          if [ "${{ inputs.susfs }}" = "y" ]; then SUSFS_FLAG="CONFIG_KSU_SUSFS=y"; fi
          echo "=== make with $SUSFS_FLAG ==="
          env CONFIG_KSU=m \
              CONFIG_KSU_MULTI_MANAGER_SUPPORT=y \
              CONFIG_KSU_TRACEPOINT_HOOK=y \
              "$SUSFS_FLAG" \
              CC=clang make -j"$(nproc)"

      - name: Inspect result
        run: |
          set -e
          ls -la bakasu-src/kernel/kernelsu.ko
          echo "--- modinfo ---"
          strings bakasu-src/kernel/kernelsu.ko | grep -E "^(vermagic|license|name|depends)=" || true
          echo "--- susfs symbol count ---"
          strings bakasu-src/kernel/kernelsu.ko | grep -ic susfs || true
          cp bakasu-src/kernel/kernelsu.ko "$GITHUB_WORKSPACE/kernelsu-susfs.ko"
          llvm-strip -d "$GITHUB_WORKSPACE/kernelsu-susfs.ko" || true
          ls -la "$GITHUB_WORKSPACE/kernelsu-susfs.ko"
          sha256sum "$GITHUB_WORKSPACE/kernelsu-susfs.ko"

      - name: Upload kernelsu.ko
        uses: actions/upload-artifact@v4
        with:
          name: bakasu-lkm-${{ inputs.kmi }}-susfs
          path: kernelsu-susfs.ko
