name: Build BakaSU LKM (SUSFS) android16-6.12

on:
  workflow_dispatch:
    inputs:
      kmi:
        description: 'KMI / DDK image tag'
        required: false
        default: 'android16-6.12'
      ddk_release:
        description: 'DDK release suffix'
        required: false
        default: '20260828'
      susfs:
        description: 'Enable SUSFS (y/n)'
        required: false
        default: 'y'
      bakasu_ref:
        description: 'BakaSU git ref'
        required: false
        default: 'main'

jobs:
  build-lkm:
    name: kernelsu.ko for ${{ inputs.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged
    steps:
      - name: Checkout BakaSU
        uses: actions/checkout@v4
        with:
          repository: BakaSU/BakaSU
          ref: ${{ inputs.bakasu_ref }}
          fetch-depth: 1
          sparse-checkout: |
            kernel
            uapi

      - name: Prepare tooling
        run: |
          set -e
          echo "PWD=$(pwd)"
          ls
          echo "--- KDIR=${KDIR:-<unset>} ---"
          clang --version | head -2

      - name: Build kernelsu.ko with SUSFS
        run: |
          set -e
          cd kernel
          EXTRA=""
          if [ "${{ inputs.susfs }}" = "y" ]; then
            EXTRA="CONFIG_KSU_SUSFS=y"
          fi
          echo "=== make: CONFIG_KSU=m $EXTRA ==="
          CONFIG_KSU=m \
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=y \
          CONFIG_KSU_TRACEPOINT_HOOK=y \
          $EXTRA \
          CC=clang make -j"$(nproc)"

      - name: Inspect result
        run: |
          set -e
          ls -la kernel/kernelsu.ko
          echo "--- modinfo ---"
          strings kernel/kernelsu.ko | grep -E "^(vermagic|license|name|depends)=" || true
          echo "--- susfs string count ---"
          strings kernel/kernelsu.ko | grep -ic susfs || true
          cp kernel/kernelsu.ko "$GITHUB_WORKSPACE/kernelsu-susfs.ko"
          llvm-strip -d "$GITHUB_WORKSPACE/kernelsu-susfs.ko" || true
          ls -la "$GITHUB_WORKSPACE/kernelsu-susfs.ko"
          sha256sum "$GITHUB_WORKSPACE/kernelsu-susfs.ko"

      - name: Upload kernelsu.ko
        uses: actions/upload-artifact@v4
        with:
          name: bakasu-lkm-${{ inputs.kmi }}-susfs
          path: kernelsu-susfs.ko
